services:
  db:
    image: postgres:15-alpine
    container_name: kos_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-kos_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kos_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-kos_db}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-super-secret-key-for-nextauth-replace-me}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
    depends_on:
      - db
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  pgdata:
